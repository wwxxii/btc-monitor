<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>BTC 永續合約監測</title>
  <style>
    :root{--bg:#071019;--panel:#0d1926;--line:#21364a;--text:#edf5fb;--muted:#91a6b9;--accent:#35d5df;--green:#38d996;--red:#ff7182;--amber:#ffbf55}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 100% 0,#123655,transparent 36%),var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}main{max-width:1360px;margin:auto;padding:28px 18px 54px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.14em}h1{margin:6px 0;font-size:clamp(27px,5vw,43px)}.lead,.note,.stamp{color:var(--muted);margin:0}.controls,.alertbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.controls button,.alertbar button,select{font:inherit;border:1px solid var(--line);border-radius:10px;background:#102236;color:var(--text);padding:9px 12px;cursor:pointer}.controls button.active{color:#021015;background:var(--accent);border-color:var(--accent);font-weight:800}button:hover{filter:brightness(1.14)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:16px}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(140deg,#102338,#091521);overflow:hidden}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px 10px}.card h2{font-size:17px;margin:0}.chart{width:100%;height:500px;display:block}.side{padding:16px}.price{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}.change{margin-top:5px;font-weight:700}.up{color:var(--green)}.down{color:var(--red)}.levels{margin-top:22px;border-top:1px solid var(--line)}.level{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}.level span{color:var(--muted)}.macds{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.macdchart{width:100%;height:220px;display:block}.alertbar{margin-top:16px;padding:14px 16px}.alertbar label{color:var(--muted)}.alertbar .on{color:var(--green);font-weight:700}.status{min-height:20px;margin:12px 1px;color:var(--muted);font-size:12px}.error{color:#ffd6da}@media(max-width:850px){.layout{grid-template-columns:1fr}.chart{height:390px}.macds{grid-template-columns:1fr}.top{align-items:stretch;flex-direction:column}}@media(max-width:520px){main{padding:20px 12px}.chart{height:320px}.cardhead{padding:13px}.controls button{padding:8px 10px}.alertbar{align-items:stretch;flex-direction:column}.alertbar select,.alertbar button{width:100%}}
  </style>
</head>
<body><main>
  <header class="top"><div><div class="eyebrow">BINANCE USDⓈ-M · BTCUSDT 永續合約</div><h1>比特幣監測頁面</h1><p class="lead">主圖可切換週期｜前 3 個已完成日 K 高低點｜1H、4H MACD</p></div><div class="controls" aria-label="K線週期"><button data-i="5m">5 分</button><button data-i="15m">15 分</button><button data-i="1h" class="active">1 小時</button><button data-i="4h">4 小時</button><button data-i="1d">日 K</button></div></header>
  <section class="layout"><article class="card"><div class="cardhead"><h2 id="mainTitle">BTC-USDT · 1 小時 K 線</h2><span class="stamp" id="updated">尚未載入</span></div><canvas id="mainChart" class="chart" aria-label="BTC K線圖"></canvas></article><aside class="card side"><div class="eyebrow">最新價格</div><div class="price" id="price">—</div><div class="change" id="change">—</div><div class="levels"><div class="level"><span>昨日高點</span><b id="d1h">—</b></div><div class="level"><span>昨日低點</span><b id="d1l">—</b></div><div class="level"><span>前 2 日高點</span><b id="d2h">—</b></div><div class="level"><span>前 2 日低點</span><b id="d2l">—</b></div><div class="level"><span>前 3 日高點</span><b id="d3h">—</b></div><div class="level"><span>前 3 日低點</span><b id="d3l">—</b></div></div><p class="note" style="margin-top:14px">虛線標示這 6 個日 K 價位；不包含尚未收盤的今天日 K。</p></aside></section>
  <section class="macds"><article class="card"><div class="cardhead"><h2>MACD · 1 小時</h2><span class="stamp" id="macd1status">—</span></div><canvas id="macd1" class="macdchart" aria-label="一小時 MACD"></canvas></article><article class="card"><div class="cardhead"><h2>MACD · 4 小時</h2><span class="stamp" id="macd4status">—</span></div><canvas id="macd4" class="macdchart" aria-label="四小時 MACD"></canvas></article></section>
  <section class="card alertbar"><strong>MACD 交叉提醒</strong><label>週期 <select id="alertTf"><option value="1h">1 小時</option><option value="4h">4 小時</option><option value="both">1H + 4H</option></select></label><label>方向 <select id="alertSide"><option value="both">金叉＋死叉</option><option value="bull">只提醒金叉</option><option value="bear">只提醒死叉</option></select></label><button id="alertButton">開啟瀏覽器提醒</button><span id="alertState" class="note">未啟用</span></section>
  <p id="status" class="status">正在讀取 Binance 公開行情…</p><p class="note">提醒以「已收 K」的 MACD 線與訊號線交叉判定；頁面開著時每 60 秒刷新。</p>
</main><script>
  const API='https://fapi.binance.com/fapi/v1/klines', SYMBOL='BTCUSDT';
  const state={interval:'1h',rows:{},alert:false,lastCross:{}}; const $=s=>document.querySelector(s), fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2}), money=n=>'$'+fmt(n);
  async function candles(interval,limit){const u=`${API}?symbol=${SYMBOL}&interval=${interval}&limit=${limit}`;const r=await fetch(u);if(!r.ok)throw Error(`Binance API ${r.status}`);const j=await r.json();if(!Array.isArray(j))throw Error(j.msg||'行情格式異常');return j.map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4]})).sort((a,b)=>a.t-b.t)}
  function fit(c){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return [x,r.width,r.height]}
  function line(ctx,pts,color,w=1,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.strokeStyle=color;ctx.lineWidth=w;pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.setLineDash([])}
  function drawCandles(rows,levels){const [ctx,W,H]=fit($('#mainChart')),p={l:12,r:70,t:12,b:24},hi=Math.max(...rows.map(x=>x.h),...levels.map(x=>x.v)),lo=Math.min(...rows.map(x=>x.l),...levels.map(x=>x.v)),span=hi-lo||1,y=v=>p.t+(hi-v)/span*(H-p.t-p.b),step=(W-p.l-p.r)/rows.length,bw=Math.max(2,step*.6);ctx.font='11px system-ui';ctx.textAlign='right';for(let i=0;i<5;i++){let yy=p.t+(H-p.t-p.b)*i/4,v=hi-span*i/4;line(ctx,[[p.l,yy],[W-p.r,yy]],'#20364b');ctx.fillStyle='#91a6b9';ctx.fillText(fmt(v),W-4,yy+4)}levels.forEach(({v,name,color})=>{const yy=y(v);line(ctx,[[p.l,yy],[W-p.r,yy]],color,1,[4,4]);ctx.fillStyle=color;ctx.fillText(name,W-p.r-3,yy-3)});rows.forEach((x,i)=>{const cx=p.l+step*(i+.5),color=x.c>=x.o?'#38d996':'#ff7182';line(ctx,[[cx,y(x.h)],[cx,y(x.l)]],color);ctx.fillStyle=color;ctx.fillRect(cx-bw/2,Math.min(y(x.o),y(x.c)),bw,Math.max(1,Math.abs(y(x.o)-y(x.c))))})}
  function ema(a,n){const k=2/(n+1),out=[];a.forEach((v,i)=>out.push(i?v*k+out[i-1]*(1-k):v));return out}function macd(rows){const c=rows.map(x=>x.c),fast=ema(c,12),slow=ema(c,26),m=fast.map((v,i)=>v-slow[i]),s=ema(m,9);return m.map((v,i)=>({m:v,s:s[i],h:v-s[i],t:rows[i].t}))}
  function drawMacd(id,data){const [ctx,W,H]=fit($(id)),p={l:12,r:12,t:12,b:17},vals=data.flatMap(x=>[x.m,x.s,x.h,0]),max=Math.max(...vals.map(Math.abs))||1,y=v=>p.t+(max-v)/(max*2)*(H-p.t-p.b),step=(W-p.l-p.r)/(data.length-1),x=i=>p.l+i*step;line(ctx,[[p.l,y(0)],[W-p.r,y(0)]],'#40546a');data.forEach((v,i)=>{ctx.fillStyle=v.h>=0?'#38d99699':'#ff718299';ctx.fillRect(x(i)-Math.max(1,step*.32),Math.min(y(0),y(v.h)),Math.max(2,step*.64),Math.abs(y(v.h)-y(0)))});line(ctx,data.map((v,i)=>[x(i),y(v.m)]),'#35d5df',1.7);line(ctx,data.map((v,i)=>[x(i),y(v.s)]),'#ffbf55',1.5);}
  function cross(d){const a=d.at(-2),b=d.at(-1);return a.m<=a.s&&b.m>b.s?'bull':a.m>=a.s&&b.m<b.s?'bear':null}
  function notification(tf,side){if(!state.alert||!side)return;const pick=$('#alertTf').value,want=$('#alertSide').value;if(!(pick===tf||pick==='both')||(want!==side&&want!=='both'))return;const key=tf+side;if(state.lastCross[key])return;state.lastCross[key]=true;new Notification(`BTC ${tf} MACD ${side==='bull'?'金叉':'死叉'}`,{body:`已收 K 出現${side==='bull'?'金叉':'死叉'}，BTC-USDT`})}
  async function load(){try{const [main,daily,hour,four]=await Promise.all([candles(state.interval,120),candles('1d',5),candles('1h',160),candles('4h',160)]);const completed=daily.slice(0,-1).slice(-3).reverse(),levels=completed.flatMap((x,i)=>[{v:x.h,name:`D-${i+1} H`,color:'#ffbf55'},{v:x.l,name:`D-${i+1} L`,color:'#8b9fb4'}]);drawCandles(main,levels);const last=main.at(-1),prev=main.at(-2),delta=(last.c-prev.c)/prev.c*100;$('#price').textContent=money(last.c);$('#change').textContent=`${delta>=0?'+':''}${delta.toFixed(2)}%`;$('#change').className='change '+(delta>=0?'up':'down');completed.forEach((x,i)=>{$(`#d${i+1}h`).textContent=money(x.h);$(`#d${i+1}l`).textContent=money(x.l)});const m1=macd(hour),m4=macd(four);drawMacd('#macd1',m1.slice(-100));drawMacd('#macd4',m4.slice(-100));const c1=cross(m1),c4=cross(m4);$('#macd1status').textContent=c1?(c1==='bull'?'最新已收 K 金叉':'最新已收 K 死叉'):'無新交叉';$('#macd4status').textContent=c4?(c4==='bull'?'最新已收 K 金叉':'最新已收 K 死叉'):'無新交叉';notification('1h',c1);notification('4h',c4);if(!c1)delete state.lastCross['1hbull'],delete state.lastCross['1hbear'];if(!c4)delete state.lastCross['4hbull'],delete state.lastCross['4hbear'];$('#updated').textContent='更新 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('#status').textContent='Binance 公開行情已同步；下一次更新約在 60 秒後。'}catch(e){$('#status').innerHTML=`<span class="error">載入失敗：${e.message}</span>`}}
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{state.interval=b.dataset.i;document.querySelectorAll('[data-i]').forEach(x=>x.classList.toggle('active',x===b));$('#mainTitle').textContent=`BTC-USDT · ${b.textContent} K 線`;load()});$('#alertButton').onclick=async()=>{if(!('Notification'in window)){alert('這個瀏覽器不支援桌面通知');return}const p=await Notification.requestPermission();state.alert=p==='granted';$('#alertState').textContent=state.alert?'已啟用：頁面開啟時偵測已收 K 交叉':'通知權限未開啟';$('#alertState').className=state.alert?'on':'note'};addEventListener('resize',()=>load());load();setInterval(load,60000);
</script><script src="btc-ratio-overlay.js"></script><script src="btc-sentiment-analysis.js"></script></body></html>
